<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>เข้าสู่ระบบ | SK Travel&Tour Hatyai</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ================= HEADER ================= -->

    <header class="header">

        <div class="logo">
            🌴 SK Travel&Tour
        </div>

        <nav class="menu">

            <a href="index.html">
                หน้าแรก
            </a>

            <a href="tours.html">
                แพ็กเกจทัวร์
            </a>

            <a href="booking.html">
                จองทัวร์
            </a>

            <a href="login.html">
                เข้าสู่ระบบ
            </a>

        </nav>

    </header>


    <!-- ================= LOGIN ================= -->

    <section class="login-section">

        <div class="login-box">

            <div class="login-icon">
                👤
            </div>

            <h1>
                เข้าสู่ระบบ
            </h1>

            <p class="login-description">
                เข้าสู่ระบบ SK Travel&Tour Hatyai
            </p>


            <!-- LOGIN FORM -->

            <form class="login-form">

                <label for="email">
                    อีเมล
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="กรอกอีเมล"
                    required
                >


                <label for="password">
                    รหัสผ่าน
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="กรอกรหัสผ่าน"
                    required
                >


                <div class="login-options">

                    <label class="remember">
                        <input
                            type="checkbox"
                            name="remember"
                        >

                        จำการเข้าสู่ระบบ
                    </label>

                    <a href="#">
                        ลืมรหัสผ่าน?
                    </a>

                </div>


                <button
                    type="submit"
                    class="btn primary login-button"
                >
                    🔐 เข้าสู่ระบบ
                </button>

            </form>


            <!-- REGISTER -->

            <div class="register-link">

                <p>
                    ยังไม่มีบัญชี?
                    <a href="register.html">
                        สมัครสมาชิก
                    </a>
                </p>

            </div>


            <!-- BACK HOME -->

            <a
                href="index.html"
                class="back-home"
            >
                ← กลับหน้าแรก
            </a>

        </div>

    </section>


    <!-- ================= FOOTER ================= -->

    <footer class="footer">

        <div class="footer-logo">
            🌴 SK Travel&Tour Hatyai
        </div>

        <p>
            บริการท่องเที่ยวและจองทัวร์
        </p>

        <p class="copyright">
            © 2026 SK Travel&Tour Hatyai
        </p>

    </footer>

</body>

</html>
