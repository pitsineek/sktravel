<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>สมัครสมาชิก | SK Travel&Tour Hatyai</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ================= HEADER ================= -->

    <header class="header">

        <div class="logo">
            🌴 SK Travel&Tour Hatyai
        </div>

        <nav class="menu">

            <a href="index.html">
                หน้าแรก
            </a>

            <a href="tours.html">
                แพ็กเกจทัวร์
            </a>

            <a href="booking.html">
                จองทัวร์
            </a>

        </nav>

    </header>


    <!-- ================= REGISTER ================= -->

    <main class="auth-page">

        <div class="auth-container">


            <!-- LEFT SIDE -->

            <div class="auth-info">

                <div class="auth-logo">
                    🌴
                </div>

                <h1>
                    SK Travel&Tour
                </h1>

                <p>
                    เริ่มต้นการเดินทาง
                    <br>
                    ไปกับเรา
                </p>

                <span>
                    จองทัวร์ง่าย
                    สะดวก
                    และรวดเร็ว
                </span>

            </div>


            <!-- RIGHT SIDE -->

            <div class="auth-form-box">

                <h2>
                    สร้างบัญชีผู้ใช้งาน
                </h2>

                <p class="auth-subtitle">
                    สมัครสมาชิกเพื่อเริ่มต้นการจองทัวร์
                </p>


                <form id="registerForm">


                    <!-- ชื่อ -->

                    <div class="form-group">

                        <label for="fullname">
                            ชื่อ-นามสกุล
                        </label>

                        <input
                            type="text"
                            id="fullname"
                            name="fullname"
                            placeholder="กรอกชื่อ-นามสกุล"
                            required
                        >

                    </div>


                    <!-- เบอร์โทร -->

                    <div class="form-group">

                        <label for="phone">
                            เบอร์โทรศัพท์
                        </label>

                        <input
                            type="tel"
                            id="phone"
                            name="phone"
                            placeholder="กรอกเบอร์โทรศัพท์"
                            required
                        >

                    </div>


                    <!-- EMAIL -->

                    <div class="form-group">

                        <label for="email">
                            อีเมล
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="example@email.com"
                            required
                        >

                    </div>


                    <!-- PASSWORD -->

                    <div class="form-group">

                        <label for="password">
                            รหัสผ่าน
                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="กรอกรหัสผ่าน"
                            required
                        >

                    </div>


                    <!-- CONFIRM PASSWORD -->

                    <div class="form-group">

                        <label for="confirmPassword">
                            ยืนยันรหัสผ่าน
                        </label>

                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            placeholder="กรอกรหัสผ่านอีกครั้ง"
                            required
                        >

                    </div>


                    <!-- TERMS -->

                    <div class="terms">

                        <label>

                            <input
                                type="checkbox"
                                id="terms"
                                required
                            >

                            ยอมรับเงื่อนไขการใช้งาน
                            และนโยบายความเป็นส่วนตัว

                        </label>

                    </div>


                    <!-- BUTTON -->

                    <button
                        type="submit"
                        class="auth-button"
                    >
                        สมัครสมาชิก
                    </button>


                </form>


                <!-- LOGIN -->

                <div class="auth-bottom">

                    <p>
                        มีบัญชีอยู่แล้ว?
                    </p>

                    <a href="login.html">
                        เข้าสู่ระบบ
                    </a>

                </div>


                <!-- HOME -->

                <a
                    href="index.html"
                    class="auth-home"
                >
                    ← กลับหน้าแรก
                </a>

            </div>

        </div>

    </main>


    <!-- ================= FOOTER ================= -->

    <footer class="footer">

        <p>
            © 2026 SK Travel&Tour Hatyai
        </p>

    </footer>


    <!-- ================= JAVASCRIPT ================= -->

    <script>

        const registerForm =
            document.getElementById("registerForm");

        registerForm.addEventListener("submit", function(event) {

            event.preventDefault();

            const password =
                document.getElementById("password").value;

            const confirmPassword =
                document.getElementById("confirmPassword").value;


            if (password !== confirmPassword) {

                alert("รหัสผ่านไม่ตรงกัน");

                return;

            }


            alert("สมัครสมาชิกสำเร็จ");

        });

    </script>

</body>

</html>
