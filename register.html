<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>สมัครสมาชิก | SK Travel&Tour Hatyai</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ================= HEADER ================= -->

    <header class="header">

        <div class="logo">
            🌴 SK Travel&Tour
        </div>

        <nav class="menu">

            <a href="index.html">
                หน้าแรก
            </a>

            <a href="tours.html">
                แพ็กเกจทัวร์
            </a>

            <a href="booking.html">
                จองทัวร์
            </a>

            <a href="login.html">
                เข้าสู่ระบบ
            </a>

        </nav>

    </header>


    <!-- ================= REGISTER ================= -->

    <section class="login-section">

        <div class="login-box">

            <div class="login-icon">
                📝
            </div>

            <h1>
                สมัครสมาชิก
            </h1>

            <p class="login-description">
                สร้างบัญชี SK Travel&Tour Hatyai
            </p>


            <!-- REGISTER FORM -->

            <form class="login-form">

                <!-- NAME -->

                <label for="fullname">
                    ชื่อ-นามสกุล
                </label>

                <input
                    type="text"
                    id="fullname"
                    name="fullname"
                    placeholder="กรอกชื่อ-นามสกุล"
                    required
                >


                <!-- PHONE -->

                <label for="phone">
                    เบอร์โทรศัพท์
                </label>

                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="กรอกเบอร์โทรศัพท์"
                    required
                >


                <!-- EMAIL -->

                <label for="email">
                    อีเมล
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="กรอกอีเมล"
                    required
                >


                <!-- PASSWORD -->

                <label for="password">
                    รหัสผ่าน
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="กรอกรหัสผ่าน"
                    required
                >


                <!-- CONFIRM PASSWORD -->

                <label for="confirm-password">
                    ยืนยันรหัสผ่าน
                </label>

                <input
                    type="password"
                    id="confirm-password"
                    name="confirm-password"
                    placeholder="กรอกรหัสผ่านอีกครั้ง"
                    required
                >


                <!-- TERMS -->

                <label class="remember">

                    <input
                        type="checkbox"
                        name="terms"
                        required
                    >

                    ยอมรับเงื่อนไขการใช้งาน

                </label>


                <!-- BUTTON -->

                <button
                    type="submit"
                    class="btn primary login-button"
                >
                    📝 สมัครสมาชิก
                </button>

            </form>


            <!-- LOGIN -->

            <div class="register-link">

                <p>
                    มีบัญชีอยู่แล้ว?

                    <a href="login.html">
                        เข้าสู่ระบบ
                    </a>
                </p>

            </div>


            <!-- BACK HOME -->

            <a
                href="index.html"
                class="back-home"
            >
                ← กลับหน้าแรก
            </a>

        </div>

    </section>


    <!-- ================= FOOTER ================= -->

    <footer class="footer">

        <div class="footer-logo">
            🌴 SK Travel&Tour Hatyai
        </div>

        <p>
            บริการท่องเที่ยวและจองทัวร์
        </p>

        <p class="copyright">
            © 2026 SK Travel&Tour Hatyai
        </p>

    </footer>


</body>

</html>
